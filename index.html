    <script>
      // Native EXE local loopback server lifecycle keep-alive (when launched via standalone Windows .exe)
      (function () {
        try {
          var isLocalLoopback =
            (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') &&
            window.location.port !== '3000' &&
            window.location.port !== '5173';
          if (isLocalLoopback) {
            setInterval(function () {
              fetch('/api/ping', { method: 'GET', cache: 'no-store' }).catch(function () {});
            }, 4000);
            window.addEventListener('beforeunload', function () {
              if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/shutdown');
              } else {
                fetch('/api/shutdown', { method: 'GET', keepalive: true }).catch(function () {});
              }
            });
          }
        } catch (e) {}
      })();
    </script>
