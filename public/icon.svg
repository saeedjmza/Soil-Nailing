<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="nailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- App Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="102" fill="none" stroke="#334155" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Subtle Technical Grid Lines -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.65">
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
  </g>

  <!-- Retained Soil Mass Polygon (Right / Center-Right) -->
  <path d="M180,96 L432,96 L432,416 L180,416 Z" fill="url(#soilGrad)" stroke="#334155" stroke-width="2" opacity="0.9"/>
  <!-- Soil Strata Layers -->
  <path d="M180,192 Q290,178 432,202" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.7"/>
  <path d="M180,316 Q310,334 432,306" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.7"/>

  <!-- Critical Slip Plane Curve -->
  <path d="M180,416 Q240,260 356,96" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 7" opacity="0.75"/>

  <!-- Shotcrete + Permanent Facing Wall -->
  <rect x="142" y="96" width="22" height="320" rx="4" fill="#64748b"/>
  <rect x="164" y="96" width="16" height="320" rx="2" fill="#475569"/>
  <rect x="142" y="96" width="38" height="320" rx="4" fill="none" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Excavation Bench Base -->
  <path d="M72,416 L438,416" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <!-- Upper Soil Nail Row (Inclined ~15 deg) -->
  <g transform="translate(152, 180) rotate(14)">
    <!-- Grout Cylinder -->
    <rect x="28" y="-14" width="232" height="28" rx="14" fill="#0ea5e9" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Tendon Rebar Core -->
    <rect x="-12" y="-5" width="262" height="10" rx="5" fill="url(#nailGrad)"/>
    <!-- Bearing Plate & Nut -->
    <rect x="-24" y="-22" width="12" height="44" rx="3" fill="url(#goldGrad)"/>
    <rect x="-34" y="-11" width="10" height="22" rx="2" fill="#e2e8f0"/>
    <!-- Headed Studs into Facing -->
    <line x1="-12" y1="-12" x2="-4" y2="-12" stroke="#fbbf24" stroke-width="3.5"/>
    <line x1="-12" y1="12" x2="-4" y2="12" stroke="#fbbf24" stroke-width="3.5"/>
  </g>

  <!-- Lower Soil Nail Row (Inclined ~15 deg) -->
  <g transform="translate(152, 300) rotate(14)">
    <!-- Grout Cylinder -->
    <rect x="28" y="-14" width="222" height="28" rx="14" fill="#10b981" fill-opacity="0.22" stroke="#34d399" stroke-width="2.5"/>
    <!-- Tendon Rebar Core -->
    <rect x="-12" y="-5" width="252" height="10" rx="5" fill="url(#emGrad)"/>
    <!-- Bearing Plate & Nut -->
    <rect x="-24" y="-22" width="12" height="44" rx="3" fill="url(#goldGrad)"/>
    <rect x="-34" y="-11" width="10" height="22" rx="2" fill="#e2e8f0"/>
  </g>

  <!--LRFD Checkmark Badge Overlay -->
  <circle cx="388" cy="368" r="46" fill="#090d16" stroke="#10b981" stroke-width="4"/>
  <path d="M368,368 L382,382 L410,352" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Corner Title Tag -->
  <rect x="78" y="84" width="52" height="26" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="104" y="102" font-family="ui-monospace, monospace" font-weight="800" font-size="14" fill="#fbbf24" text-anchor="middle">LRFD</text>
</svg>
